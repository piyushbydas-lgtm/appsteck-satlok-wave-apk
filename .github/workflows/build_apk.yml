name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK & Release v1.0.0
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Make gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK Exists
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK generated successfully!"
          else
            echo "Error: APK not found!"
            exit 1
          fi

      - name: Rename APK to Satlok-Wave-v1.0.0.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Satlok-Wave-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Satlok-Wave-v1.0.0-Artifact
          path: Satlok-Wave-v1.0.0.apk

      - name: Create or Update GitHub Release v1.0.0 and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: Satlok-Wave-v1.0.0.apk
          tag_name: v1.0.0
          name: "Satlok Wave v1.0.0"
          body: "Official Android APK release for Satlok Wave v1.0.0. Download Satlok-Wave-v1.0.0.apk directly from this release."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
